<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>408 有图题裁剪审查 · 对照原页</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --border:#2a3140; --text:#e8eaed;
    --muted:#9aa3b2; --ok:#3dd68c; --bad:#f07178; --skip:#e6c07b; --accent:#7aa2f7; --chip:#222833;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
  header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  header h1{font-size:15px;margin:0;font-weight:600}
  .stats{color:var(--muted);font-size:13px}
  .stats b{color:var(--text)}
  .stats .ok{color:var(--ok)}.stats .bad{color:var(--bad)}.stats .skip{color:var(--skip)}
  .filters,.toolbar-right{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .toolbar-right{margin-left:auto}
  .filters button,.filters select,.filters input,.toolbar-right button{
    background:var(--chip);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
  .filters button.active{border-color:var(--accent);color:var(--accent)}
  .filters input[type=search]{min-width:180px;cursor:text}
  .banner{max-width:1280px;margin:12px auto 0;padding:10px 14px;background:#1a2233;border:1px solid #2d3a55;border-radius:10px;color:#c5d0e6;font-size:13px}
  .banner code{background:#0f141f;padding:1px 6px;border-radius:4px}
  main{max-width:1280px;margin:0 auto;padding:16px;display:grid;gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .card.mark-ok{border-color:color-mix(in srgb,var(--ok) 55%,var(--border))}
  .card.mark-bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--border))}
  .card.mark-skip{border-color:color-mix(in srgb,var(--skip) 55%,var(--border))}
  .card-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}
  .idx{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
  .chip{background:var(--chip);border-radius:999px;padding:2px 8px;border:1px solid var(--border)}
  .chip.warn{color:var(--bad)}
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:1px solid var(--border)}
  @media(max-width:900px){.compare{grid-template-columns:1fr}}
  .pane{min-height:180px;display:flex;flex-direction:column;background:#111}
  .pane + .pane{border-left:1px solid var(--border)}
  @media(max-width:900px){.pane + .pane{border-left:0;border-top:1px solid var(--border)}}
  .pane-label{font-size:11px;padding:6px 10px;color:var(--muted);background:#141820;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
  .pane-label b{color:var(--text);font-weight:600}
  .pane-body{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;background:#fff;min-height:200px}
  .pane-body img{max-width:100%;max-height:460px;object-fit:contain;cursor:zoom-in}
  .pane-body.page img{max-height:560px}
  .missing{color:#b00;font-size:13px;text-align:center;padding:20px}
  .meta{padding:12px 14px;font-size:13px}
  .meta .content{white-space:pre-wrap;word-break:break-word;margin:0 0 10px}
  .meta .opts{margin:0;padding:0;list-style:none;color:var(--muted)}
  .meta .ans{margin-top:8px;color:var(--ok);font-size:12px}
  .meta .path{margin-top:8px;font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted);word-break:break-all}
  .actions{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:#12151c}
  .actions button{border:1px solid var(--border);background:var(--chip);color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
  .actions button.ok.active,.actions button.ok:hover{background:#163528;border-color:var(--ok);color:var(--ok)}
  .actions button.bad.active,.actions button.bad:hover{background:#3a1a1d;border-color:var(--bad);color:var(--bad)}
  .actions button.skip.active,.actions button.skip:hover{background:#3a3018;border-color:var(--skip);color:var(--skip)}
  .actions input.note{flex:1;min-width:140px;background:#0f1115;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 10px;font-size:12px}
  .lightbox{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.9);align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
  .lightbox.show{display:flex;flex-direction:column;gap:8px}
  .lightbox .lb-cap{color:#ccc;font-size:12px;text-align:center}
  .lightbox img{max-width:96vw;max-height:90vh;object-fit:contain;background:#fff;border-radius:4px}
  footer{max-width:1280px;margin:0 auto 40px;padding:0 16px;color:var(--muted);font-size:12px}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  kbd{background:var(--chip);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:11px}
</style>
</head>
<body>
<header>
  <h1>408 有图题 · 裁剪对照审查</h1>
  <div class="stats" id="stats">加载中…</div>
  <div class="filters">
    <button data-course="all" class="active">全部</button>
    <button data-course="ds">数据结构</button>
    <button data-course="coa">组成</button>
    <button data-course="os">OS</button>
    <button data-course="net">网络</button>
    <select id="markFilter">
      <option value="all">标记：全部</option>
      <option value="unset">未判</option>
      <option value="ok">截对 ✓</option>
      <option value="bad">截错 ✗</option>
      <option value="skip">存疑 ?</option>
    </select>
    <label style="font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center">
      <input type="checkbox" id="onlyMissing" /> 仅缺文件
    </label>
    <input type="search" id="q" placeholder="搜题干 / id / 页码 / 路径" />
  </div>
  <div class="toolbar-right">
    <button type="button" id="btnExport">导出判定 JSON</button>
    <button type="button" id="btnImport">导入判定</button>
    <button type="button" id="btnClear">清空判定</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden />
  </div>
</header>
<div class="banner">
  <b>说明：</b>左栏 = 题库实际使用的裁切图（和刷题页同一文件）；右栏 = 王道 PDF 该页缩略图，用来对照裁得全不全。
  不是另一套题库。若左图和刷题页不一致，多半是浏览器缓存——强制刷新或点左图看路径。
  数据源：<code>math-bank/data-*.json</code> + <code>crops/*</code> + <code>assets/pdf_images/*</code>。
</div>
<main id="list"></main>
<footer>
  快捷键：<kbd>1</kbd>截对 · <kbd>2</kbd>截错 · <kbd>3</kbd>存疑 · <kbd>J</kbd>/<kbd>K</kbd> 下/上 · 点图放大。
  判定存 localStorage，导出 JSON 给助手批量重裁。
</footer>
<div class="lightbox" id="lb"><div class="lb-cap" id="lbCap"></div><img alt="放大" /></div>
<script>
const DATA_URL = "./fig-review-data.json";
const LS_KEY = "bank408-fig-review-v2";
let items = [];
let marks = {};
let course = "all";
let focusIdx = 0;

function loadMarks(){ try{ marks=JSON.parse(localStorage.getItem(LS_KEY)||"{}")||{}; }catch{ marks={}; } }
function saveMarks(){ localStorage.setItem(LS_KEY, JSON.stringify(marks)); updateStats(); }
function getMark(uid){ return marks[uid]||{mark:"unset",note:""}; }
function setMark(uid, mark, note){
  const prev=getMark(uid);
  marks[uid]={mark:mark||prev.mark||"unset", note: note!=null?note:(prev.note||""), ts:new Date().toISOString()};
  if(marks[uid].mark==="unset" && !marks[uid].note) delete marks[uid];
  saveMarks();
  const card=document.querySelector(`[data-uid="${CSS.escape(uid)}"]`);
  if(card) applyCardMark(card, uid);
}
function applyCardMark(card, uid){
  const m=getMark(uid).mark||"unset";
  card.classList.remove("mark-ok","mark-bad","mark-skip");
  if(m==="ok") card.classList.add("mark-ok");
  if(m==="bad") card.classList.add("mark-bad");
  if(m==="skip") card.classList.add("mark-skip");
  card.querySelectorAll(".actions button[data-mark]").forEach(b=>b.classList.toggle("active", b.dataset.mark===m));
}
function updateStats(){
  const visible=filtered();
  let ok=0,bad=0,skip=0,unset=0,miss=0,nopdf=0;
  for(const it of items){
    const m=getMark(it.uid).mark||"unset";
    if(m==="ok")ok++; else if(m==="bad")bad++; else if(m==="skip")skip++; else unset++;
    if(!it.file_ok) miss++;
    if(!it.pdf_ok) nopdf++;
  }
  document.getElementById("stats").innerHTML =
    `共 <b>${items.length}</b> · 显示 <b>${visible.length}</b> · `+
    `<span class="ok">对 ${ok}</span> · <span class="bad">错 ${bad}</span> · <span class="skip">疑 ${skip}</span> · 未判 <b>${unset}</b>`+
    (miss?` · <span class="bad">缺裁图 ${miss}</span>`:"")+
    (nopdf?` · 无原页 ${nopdf}`:"");
}
function filtered(){
  const mf=document.getElementById("markFilter").value;
  const onlyMiss=document.getElementById("onlyMissing").checked;
  const q=(document.getElementById("q").value||"").trim().toLowerCase();
  return items.filter(it=>{
    if(course!=="all" && it.course!==course) return false;
    const m=getMark(it.uid).mark||"unset";
    if(mf!=="all" && m!==mf) return false;
    if(onlyMiss && it.file_ok) return false;
    if(q){
      const blob=[it.content,it.id,String(it.page),it.image,it.chapter,it.topic,it.uid].join(" ").toLowerCase();
      if(!blob.includes(q)) return false;
    }
    return true;
  });
}
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

function render(){
  const list=document.getElementById("list");
  const rows=filtered();
  updateStats();
  if(!rows.length){ list.innerHTML=`<div class="empty">没有匹配的题目</div>`; return; }
  list.innerHTML = rows.map((it,i)=>{
    const mk=getMark(it.uid);
    const opts=(it.options||[]).map(o=>`<li><b>${esc(o.k)}.</b> ${esc(o.v)}</li>`).join("");
    const crop = it.file_ok
      ? `<img src="${esc(it.image)}?v=review2" alt="题库裁图" loading="lazy" data-full="${esc(it.image)}" data-cap="题库裁图 ${esc(it.image)}" />`
      : `<div class="missing">缺裁图<br/>${esc(it.image||"(无路径)")}</div>`;
    const page = it.pdf_ok && it.page_thumb
      ? `<img src="${esc(it.page_thumb)}?v=1" alt="PDF原页" loading="lazy" data-full="${esc(it.page_thumb)}" data-cap="PDF 原页 p${esc(it.page)}" />`
      : `<div class="missing">本机无 PDF 切页<br/>assets/pdf_images/${esc(it.course)}/page_${String(it.page).padStart(3,"0")}.png</div>`;
    return `<article class="card" data-uid="${esc(it.uid)}" data-i="${i}">
      <div class="card-head">
        <span class="idx">#${i+1}</span>
        <span class="chip">${esc(it.course_name)}</span>
        <span class="chip">${esc(it.id)} · p${esc(it.page)}</span>
        <span class="chip">${esc(it.type||"")}</span>
        ${it.file_ok?"":`<span class="chip warn">缺裁图</span>`}
        ${it.pdf_ok?"":`<span class="chip warn">缺原页</span>`}
        <span style="flex:1"></span>
        <span>${esc(it.chapter)}</span>
      </div>
      <div class="compare">
        <div class="pane">
          <div class="pane-label"><b>左 · 题库裁图</b><span>刷题页用这张</span></div>
          <div class="pane-body">${crop}</div>
        </div>
        <div class="pane">
          <div class="pane-label"><b>右 · PDF 原页 p${esc(it.page)}</b><span>对照裁切范围</span></div>
          <div class="pane-body page">${page}</div>
        </div>
      </div>
      <div class="meta">
        <p class="content">${esc(it.content)}</p>
        ${opts?`<ul class="opts">${opts}</ul>`:""}
        ${it.answer?`<div class="ans">答案 ${esc(it.answer)}</div>`:""}
        <div class="path">${esc(it.image||"")}${it.image_note?" · "+esc(it.image_note):""}</div>
      </div>
      <div class="actions">
        <button type="button" class="ok" data-mark="ok" data-uid="${esc(it.uid)}">✓ 截对 (1)</button>
        <button type="button" class="bad" data-mark="bad" data-uid="${esc(it.uid)}">✗ 截错 (2)</button>
        <button type="button" class="skip" data-mark="skip" data-uid="${esc(it.uid)}">? 存疑 (3)</button>
        <button type="button" data-clear="${esc(it.uid)}">清</button>
        <input class="note" data-note-uid="${esc(it.uid)}" placeholder="备注：缺标签 / 裁多了题干 / 图文混…" value="${esc(mk.note||"")}" />
      </div>
    </article>`;
  }).join("");

  list.querySelectorAll(".card").forEach(card=>applyCardMark(card, card.dataset.uid));
  list.querySelectorAll("button[data-mark]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const uid=btn.dataset.uid;
      const noteEl=list.querySelector(`input[data-note-uid="${CSS.escape(uid)}"]`);
      setMark(uid, btn.dataset.mark, noteEl?noteEl.value:undefined);
    });
  });
  list.querySelectorAll("button[data-clear]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      delete marks[btn.dataset.clear]; saveMarks();
      const card=list.querySelector(`[data-uid="${CSS.escape(btn.dataset.clear)}"]`);
      if(card) applyCardMark(card, btn.dataset.clear);
      const noteEl=list.querySelector(`input[data-note-uid="${CSS.escape(btn.dataset.clear)}"]`);
      if(noteEl) noteEl.value="";
    });
  });
  list.querySelectorAll("input[data-note-uid]").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const prev=getMark(inp.dataset.noteUid);
      setMark(inp.dataset.noteUid, prev.mark||"unset", inp.value);
    });
  });
  list.querySelectorAll(".pane-body img").forEach(img=>{
    img.addEventListener("click",()=>{
      const lb=document.getElementById("lb");
      lb.querySelector("img").src=img.dataset.full||img.src;
      document.getElementById("lbCap").textContent=img.dataset.cap||"";
      lb.classList.add("show");
    });
  });
  focusIdx=0; highlightFocus();
}

function visibleCards(){ return [...document.querySelectorAll("#list .card")]; }
function highlightFocus(){
  const cards=visibleCards();
  cards.forEach((c,i)=>{ c.style.outline = i===focusIdx ? "2px solid var(--accent)" : ""; });
}
function focusCard(delta){
  const cards=visibleCards(); if(!cards.length) return;
  focusIdx=Math.max(0, Math.min(cards.length-1, focusIdx+delta));
  cards[focusIdx].scrollIntoView({behavior:"smooth", block:"center"});
  highlightFocus();
}
function markFocused(mark){
  const cards=visibleCards(); if(!cards.length) return;
  const card=cards[focusIdx];
  const noteEl=card.querySelector("input[data-note-uid]");
  setMark(card.dataset.uid, mark, noteEl?noteEl.value:undefined);
  if(focusIdx < cards.length-1) focusCard(1);
}

document.getElementById("lb").addEventListener("click",()=>document.getElementById("lb").classList.remove("show"));
document.querySelectorAll(".filters button[data-course]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    course=btn.dataset.course;
    document.querySelectorAll(".filters button[data-course]").forEach(b=>b.classList.toggle("active", b===btn));
    render();
  });
});
["markFilter","onlyMissing","q"].forEach(id=>{
  document.getElementById(id).addEventListener("input", render);
  document.getElementById(id).addEventListener("change", render);
});
document.getElementById("btnExport").addEventListener("click",()=>{
  const bad=[], skip=[], ok=[];
  for(const it of items){
    const m=getMark(it.uid);
    if(!m.mark || m.mark==="unset") continue;
    const row={uid:it.uid,course:it.course,id:it.id,page:it.page,chapter:it.chapter,image:it.image,mark:m.mark,note:m.note||"",content_preview:(it.content||"").slice(0,80)};
    if(m.mark==="bad") bad.push(row); else if(m.mark==="skip") skip.push(row); else if(m.mark==="ok") ok.push(row);
  }
  const payload={exported_at:new Date().toISOString(), summary:{ok:ok.length,bad:bad.length,skip:skip.length,total_items:items.length}, bad, skip, ok, marks};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`fig-review-marks-${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById("btnImport").addEventListener("click",()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", async e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  try{
    const data=JSON.parse(await f.text());
    if(data.marks && typeof data.marks==="object") marks={...marks, ...data.marks};
    else for(const row of [...(data.bad||[]),...(data.skip||[]),...(data.ok||[])]){
      if(row.uid) marks[row.uid]={mark:row.mark, note:row.note||"", ts:new Date().toISOString()};
    }
    saveMarks(); render(); alert("已导入判定");
  }catch(err){ alert("导入失败: "+err); }
  e.target.value="";
});
document.getElementById("btnClear").addEventListener("click",()=>{
  if(!confirm("清空本机全部判定？")) return;
  marks={}; saveMarks(); render();
});
document.addEventListener("keydown", e=>{
  const t=e.target;
  if(t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable)) return;
  if(document.getElementById("lb").classList.contains("show")){
    if(e.key==="Escape") document.getElementById("lb").classList.remove("show");
    return;
  }
  if(e.key==="1"){ e.preventDefault(); markFocused("ok"); }
  else if(e.key==="2"){ e.preventDefault(); markFocused("bad"); }
  else if(e.key==="3"){ e.preventDefault(); markFocused("skip"); }
  else if(e.key==="j"||e.key==="J"||e.key==="ArrowDown"){ e.preventDefault(); focusCard(1); }
  else if(e.key==="k"||e.key==="K"||e.key==="ArrowUp"){ e.preventDefault(); focusCard(-1); }
});

loadMarks();
fetch(DATA_URL).then(r=>r.json()).then(data=>{ items=data.items||data; render(); })
.catch(err=>{ document.getElementById("list").innerHTML=`<div class="empty">加载失败：${esc(err)}</div>`; });
</script>
</body>
</html>
