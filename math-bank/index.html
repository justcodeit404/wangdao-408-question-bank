<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王道 408·精选题题库</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <h1>王道 408·精选题题库</h1>
        <p>27 王道考研复习指导</p>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换主题">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
    <select id="mobileCourseSelect" class="mobile-course-select" aria-label="切换课程"></select>
    <div class="chapter-list" id="chapterList"></div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="main">
    <div class="topbar">
      <button class="toggle-sidebar" id="toggleSidebar" aria-label="打开章节">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="course-tabs" id="courseTabs"></div>
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="搜索题目内容、公式、章节...">
      </div>
      <div class="topbar-actions">
        <select id="typeFilter" class="pill-select" aria-label="题型筛选">
          <option value="">全部题型</option>
          <option value="选择题">选择题</option>
          <option value="计算题">计算题</option>
          <option value="证明题">证明题</option>
          <option value="填空题">填空题</option>
        </select>
        <select id="featureFilter" class="pill-select" aria-label="题目特征">
          <option value="">全部题目</option>
          <option value="sub">有子问</option>
          <option value="image">有图片</option>
        </select>
        <button id="btnRandom" class="btn btn-secondary" title="随机一题">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l12.4-16.3"/><path d="M2 6h1.4c1.3 0 2.5.6 3.3 1.7l12.4 16.3"/><path d="m22 6-3 3-3-3"/><path d="m22 18-3-3-3 3"/></svg>
          <span>随机一题</span>
        </button>
        <div class="split-btn" id="practiceSplitBtn">
          <button id="btnPractice" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m10 8 6 4-6 4V8z"/></svg>
            <span>练习模式</span>
          </button>
          <button class="btn btn-primary split-arrow" id="btnPracticeArrow" aria-label="更多练习选项">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="split-menu" id="practiceMenu" hidden>
            <button class="split-menu-item" data-mode="current">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m10 8 6 4-6 4V8z"/></svg>
              <span>当前筛选</span>
            </button>
            <button class="split-menu-item" data-mode="wrong">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              <span>错题重练</span>
            </button>
            <button class="split-menu-item" data-mode="favorite">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              <span>收藏复习</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="content" id="content">
      <div class="toolbar">
        <div class="stats-row" id="statsRow"></div>
      </div>
      <div class="result-info">
        <span class="label" id="resultText">加载中...</span>
      </div>
      <div class="question-list" id="questionGrid"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>题目详情</h3>
      <div class="modal-header-actions">
        <button class="favorite-btn" id="detailFavoriteBtn" onclick="toggleDetailFavorite()" aria-label="收藏" title="收藏">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </button>
        <button class="modal-close" onclick="closeModal()" aria-label="关闭">&times;</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-content" id="modalContent"></div>
    </div>
    <div class="modal-footer">
      <button onclick="prevQuestion()">上一题</button>
      <button class="btn-primary" onclick="nextQuestion()">下一题</button>
    </div>
  </div>
</div>

<!-- Practice Modal -->
<div class="modal-overlay" id="practiceModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>练习模式</h3>
      <button class="modal-close" onclick="closePractice()" aria-label="关闭">&times;</button>
    </div>
    <div class="modal-body">
      <div id="practiceContent"></div>
    </div>
    <div class="modal-footer">
      <button onclick="closePractice()">退出</button>
      <button onclick="prevPractice()">上一题</button>
      <button class="btn-primary" onclick="nextPractice()">下一题</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
